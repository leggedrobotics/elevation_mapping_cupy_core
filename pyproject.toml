[project]
name = "elevation_mapping_cupy_core"
version = "0.1.0"
description = "Core CuPy-based elevation mapping library extracted from elevation_mapping_cupy."
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Deepana Ishtaweera", email = "deepan@leggedrobotcs.com" },
]
dependencies = [
  "cupy-cuda12x==13.6.0",
  "numpy==1.26.4",
  "scipy==1.15.3",
  "shapely==1.7.1",
  "simple-parsing==0.1.7",
  "ruamel.yaml==0.18.16",
  "opencv-python==4.11.0.86",
]

[project.urls]
Homepage = "https://github.com/leggedrobotics/elevation_mapping_cupy"
Source = "https://github.com/leggedrobotics/elevation_mapping_cupy_core"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["elevation_mapping_cupy*",]

[tool.setuptools.package-data]
elevation_mapping_cupy = ["configs/*"]

