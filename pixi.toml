[workspace]
name = "elevation-mapping-cupy-core"
version = "0.1.0"
description = "Dev + MuJoCo simulation environment for elevation_mapping_cupy_core"
channels = ["conda-forge"]
platforms = [
  # uv assumes glibc 2.28 for wheel selection unless told otherwise, which rules
  # out the manylinux_2_34 warp-lang wheels. JetPack 6 is Ubuntu 22.04 (2.35);
  # 2.34 is the minimum those wheels need.
  { platform = "linux-64", glibc = "2.34" },
  { platform = "linux-aarch64", glibc = "2.34" },
]

[dependencies]
python = "3.10.*"
pip = "*"
numpy = "<2"
scipy = "*"
pytest = "*"
matplotlib = "*"
# Software OpenGL (llvmpipe) so MuJoCo can render scene previews headless.
# The Jetson's own EGL is GLES-only and exposes no EGL device, while MuJoCo's
# EGL context asks for desktop EGL_OPENGL_BIT on a device display.
mesalib = "*"

[pypi-dependencies]
mujoco = ">=3.2"
# Optional sensor backend: real LiDAR scan patterns (Livox, Velodyne, Ouster).
# The base package is pure Python over MuJoCo; GPU backends are extras.
mujoco-lidar = ">=0.3"
# GPU ray casting for the LiDAR backend (lidar_backend="warp"). The stock PyPI
# aarch64 wheel builds its kernels against the local CUDA toolkit at runtime.
warp-lang = ">=1.7"
simple-parsing = "*"
"ruamel.yaml" = "*"
opencv-python-headless = "*"
shapely = "*"
elevation-mapping-cupy-core = { path = ".", editable = true }

# The traversability filter runs on torch and calls .cuda(), so it needs a
# CUDA-enabled build. Stock PyPI aarch64 wheels are CPU-only / SBSA; JetPack
# builds come from NVIDIA's Jetson index. Scoped to aarch64 so the manifest
# still resolves on x86 hosts, where stock PyPI wheels are already CUDA-capable.
[target.linux-aarch64.pypi-dependencies]
torch = { version = "*", index = "https://pypi.jetson-ai-lab.io/jp6/cu126" }
# The JetPack torch wheel links against cuDSS, which JetPack does not ship.
# Taking it from PyPI keeps the environment self-contained -- no sudo, no
# writing into /usr/local/cuda.
nvidia-cudss-cu12 = "==0.7.1.4"

[target.linux-64.pypi-dependencies]
torch = "*"

[activation.env]
# Keep ~/.local/lib/pythonX.Y/site-packages out of the env: stray pytest plugins
# installed there get auto-loaded and break collection.
PYTHONNOUSERSITE = "1"
CUDA_PATH = "/usr/local/cuda"
CUDA_HOME = "/usr/local/cuda"
# The harness only uses MuJoCo ray casting (CPU). No GL context is ever needed,
# and importing one on a headless Jetson fails, so disable it outright.
MUJOCO_GL = "disable"
# The simulation harness lives outside the shipped package.
PYTHONPATH = "$PIXI_PROJECT_ROOT/sim"

[target.linux-aarch64.activation.env]
# The JetPack torch wheel resolves cuDSS through the dynamic linker rather than
# torch's pip-preload path, so the wheel's lib directory has to be on the
# search path. The env layout is fixed by this manifest (default environment,
# python 3.10). JetPack's own CUDA runtime supplies cuSPARSELt and friends.
LD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/python3.10/site-packages/nvidia/cu12/lib:/usr/local/cuda/targets/aarch64-linux/lib:$LD_LIBRARY_PATH"

[tasks]
test = "pytest elevation_mapping_cupy/tests -q"
test-sim = "pytest sim/tests -q"
test-all = "pytest elevation_mapping_cupy/tests sim/tests -q"
sim = "python -m emsim.cli"
# Scene rendering goes through Mesa's software rasteriser. LD_LIBRARY_PATH has
# to be set before the process starts (the dynamic loader reads it once), so it
# lives here rather than in emsim.render.
[tasks.render]
cmd = "python -m emsim.render"
env = { MUJOCO_GL = "egl", MESA_LOADER_DRIVER_OVERRIDE = "llvmpipe", GALLIUM_DRIVER = "llvmpipe", __EGL_VENDOR_LIBRARY_DIRS = "$PIXI_PROJECT_ROOT/.pixi/envs/default/share/glvnd/egl_vendor.d", LD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/.pixi/envs/default/lib:$LD_LIBRARY_PATH" }

